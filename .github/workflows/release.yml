name: Release

# Publishing a release is a deliberate action:
#   - push a tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`, or
#   - run this workflow manually and supply the tag to create.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0 (created at this commit if it does not exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: medialib-linux
          - os: windows-latest
            target: windows
            artifact: medialib-windows
          - os: ubuntu-latest
            target: apk
            artifact: medialib-android
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Set up Java (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ${{ matrix.target }} --release

      # Package each build into a single release asset.
      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          cd build/linux/x64/release
          zip -r "$GITHUB_WORKSPACE/medialib-linux.zip" bundle

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath medialib-windows.zip

      - name: Package (Android)
        if: matrix.target == 'apk'
        run: cp build/app/outputs/flutter-apk/app-release.apk medialib-android.apk

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: medialib-*

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the tag; on a manual run it is the input.
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**
