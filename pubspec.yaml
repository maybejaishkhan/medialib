name: medialib
description: "A local-first personal media library unifying books, comics, manga, anime, movies, TV, games, and music."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  forui: ^0.27.3
  go_router: ^18.0.2
  http: ^1.6.0
  material_ui: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1


flutter:
  uses-material-design: true

  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
